---
# Host provisioning, split by concern. Order matters (each file builds on the
# one before - bridge before Incus, driver before GPU profiles, Incus before
# volumes) so don't reorder. import_tasks is static, so --list-tasks and
# --start-at-task still see every task, and each import carries a tag so one
# area can be re-run on its own, e.g.:
#   ansible-playbook -i inventory/hosts.ini site.yml --tags rtl-sdr
# (tag-limited runs skip the earlier files, so anything relying on a fact one
# of them registers - e.g. the NVIDIA driver check - needs that tag too.)

- name: Bridged networking
  import_tasks: networking.yml        # bridge + udev re-attach rule
  tags: [networking]
- name: Host NVIDIA driver
  import_tasks: nvidia-driver.yml     # apt components, headers, host NVIDIA driver
  tags: [nvidia]
- name: Incus install and init
  import_tasks: incus.yml             # NVMe-backed state, Incus install + preseed, OCI remotes, ZFS quota
  tags: [incus]
- name: GPU access for containers
  import_tasks: gpu-containers.yml    # nvidia-container-toolkit + per-GPU Incus profiles
  tags: [gpu]
- name: HAOS image
  import_tasks: haos-image.yml        # HAOS qcow2 imported as a local Incus image
  tags: [haos-image]
- name: Container volumes
  import_tasks: volumes.yml           # bind-mounted container volumes + default mosquitto.conf
  tags: [volumes]
- name: RTL-SDR dongle
  import_tasks: rtl-sdr.yml           # keep DVB-T drivers off the RTL-SDR dongle
  tags: [rtl-sdr]
- name: Power savings
  import_tasks: power.yml             # TLP, CPU governor, GPU power caps/persistence, ZFS ARC cap
  tags: [power]
- name: Incus boot ordering
  import_tasks: incus-boot.yml        # systemd ordering so Incus starts after the GPUs are ready
  tags: [incus-boot]
- name: Ollama GPU self-heal
  import_tasks: ollama-selfheal.yml   # restart Ollama if it comes up on CPU after boot
  tags: [ollama-selfheal]
- name: Host monitoring
  import_tasks: monitoring.yml        # Glances + incus-metrics-push to HA
  tags: [monitoring]
- name: ESPHome config backup
  import_tasks: esphome-backup.yml    # optional: ESPHome configs -> git (needs esphome_backup_repo)
  tags: [esphome-backup]
